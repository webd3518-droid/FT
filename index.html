<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Odds Matcher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #3498db; }
        .odds-header { font-size: 1.4em; font-weight: bold; color: #2980b9; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; text-align: center; }
        .match-count { font-size: 0.9em; color: #7f8c8d; text-align: center; margin-bottom: 15px; }
        .stat-bar { display: flex; justify-content: space-between; margin: 8px 0; font-weight: 600; }
        .history-section { margin-top: 20px; background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 0.85em; }
        .history-title { font-weight: bold; color: #e67e22; margin-bottom: 5px; display: block; }
        .game-item { border-bottom: 1px solid #eee; padding: 4px 0; display: block; }
        .game-item:last-child { border-bottom: none; }
        .debug-panel { margin-top: 50px; padding: 15px; background: #2c3e50; color: #27ae60; font-family: monospace; border-radius: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>Odds History Engine</h1>

    <div id="dashboard" class="dashboard">
        </div>

    <div class="debug-panel">
        <strong>System Status:</strong>
        <div id="debug-log">Ready...</div>
    </div>

    <script>
        const log = (msg) => {
            document.getElementById('debug-log').innerHTML += `<br>> ${msg}`;
        };

        log("Fetching latest historical matches...");

        fetch('results.json')
            .then(response => {
                if (!response.ok) throw new Error("Could not find results.json file.");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('dashboard');
                
                if (data.length === 0) {
                    log("Warning: No exact historical matches found for these odds.");
                    container.innerHTML = "<p style='text-align:center;'>No historical data found. Try broader odds in target_link.txt.</p>";
                    return;
                }

                log(`Successfully loaded ${data.length} game analyses.`);
                
                data.forEach(item => {
                    // Create the history list
                    const historyHtml = item.past_games.map(game => 
                        `<span class="game-item">${game}</span>`
                    ).join('');

                    container.innerHTML += `
                        <div class="card">
                            <div class="odds-header">${item.odds}</div>
                            <div class="match-count">Found ${item.count} games with these odds</div>
                            
                            <div class="stat-bar"><span>Home Win:</span> <span>${item.percentage.Home}%</span></div>
                            <div class="stat-bar"><span>Draw:</span> <span>${item.percentage.Draw}%</span></div>
                            <div class="stat-bar"><span>Away Win:</span> <span>${item.percentage.Away}%</span></div>
                            
                            <div class="history-section">
                                <span class="history-title">Real Historical Outcomes:</span>
                                ${historyHtml}
                            </div>
                        </div>
                    `;
                });
            })
            .catch(error => {
                log(`ERROR: ${error.message}`);
                document.getElementById('dashboard').innerHTML = `<p style='color:red; text-align:center;'>System Error: ${error.message}</p>`;
            });
    </script>
</body>
</html>
