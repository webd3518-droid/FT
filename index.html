<!DOCTYPE html>
<html>
<head>
    <title>Multi-Game Odds Analyzer</title>
    <style>
        .card { border: 2px solid #333; margin: 10px; padding: 15px; border-radius: 10px; display: inline-block; width: 300px; vertical-align: top; background: #f4f4f4; }
        .win { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Multi-Game Odds Dashboard (up to 17 Games)</h1>
    <div id="dashboard"></div>

    <script>
        fetch('results.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('dashboard');
                data.forEach(game => {
                    container.innerHTML += `
                        <div class="card">
                            <h3>Odds: ${game.target_odds}</h3>
                            <p><b>Probabilities:</b><br>
                               Home: ${game.stats.home}% | Draw: ${game.stats.draw}% | Away: ${game.stats.away}%
                            </p>
                            <p><b>Recent Trend:</b> <span class="win">${game.recent.join(" , ")}</span></p>
                            <small>History: ${game.history.slice(-3).join(" | ")}...</small>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
