<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worldwide Odds Analysis</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; }
        
        /* Loading Spinner */
        #loader { text-align: center; margin-top: 50px; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #3498db; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Match Card */
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 25px; margin-top: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .odds-header { font-size: 1.4em; font-weight: bold; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; color: #34495e; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-bottom: 20px; }
        .stat-box { padding: 15px; border-radius: 8px; color: white; }
        .home { background: #27ae60; }
        .draw { background: #95a5a6; }
        .away { background: #e67e22; }
        .stat-val { font-size: 1.8em; font-weight: bold; display: block; }
        
        .game-list { background: #f9f9f9; padding: 15px; border-radius: 8px; font-size: 0.9em; line-height: 1.6; }
        .game-list h4 { margin-top: 0; color: #7f8c8d; }
        .error-msg { background: #fff3f3; color: #d9534f; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Historical Odds Analysis</h1>

    <div id="loader">
        <div class="spinner"></div>
        <p>Fetching worldwide historical matches...</p>
    </div>

    <div id="output"></div>
</div>

<script>
    async function fetchResults() {
        const output = document.getElementById('output');
        const loader = document.getElementById('loader');
        
        try {
            // The ?t= timestamp prevents the browser from loading an old cached file
            const response = await fetch('results.json?t=' + Date.now());
            const data = await response.json();
            
            loader.style.display = 'none';

            if (!data || data.length === 0) {
                output.innerHTML = `
                    <div class="error-msg">
                        <h3>No historical matches found.</h3>
                        <p>This usually means the database is being too strict or the API connection failed. Check your GitHub Actions logs for the "Status Code".</p>
                    </div>`;
                return;
            }

            data.forEach(game => {
                output.innerHTML = `
                    <div class="card">
                        <div class="odds-header">Analysis for Odds: ${game.odds}</div>
                        <p><strong>Total Historical Matches Found:</strong> ${game.count}</p>
                        
                        <div class="stats-grid">
                            <div class="stat-box home"><span class="stat-val">${game.percentage.Home}%</span>Home Win</div>
                            <div class="stat-box draw"><span class="stat-val">${game.percentage.Draw}%</span>Draw</div>
                            <div class="stat-box away"><span class="stat-val">${game.percentage.Away}%</span>Away Win</div>
                        </div>

                        <div class="game-list">
                            <h4>Recent Similar Examples:</h4>
                            ${game.past_games.join('<br>')}
                        </div>
                    </div>
                `;
            });

        } catch (error) {
            loader.style.display = 'none';
            output.innerHTML = `<div class="error-msg"><h3>Waiting for data...</h3><p>Ensure your GitHub Action has finished running successfully.</p></div>`;
        }
    }

    fetchResults();
</script>

</body>
</html>
